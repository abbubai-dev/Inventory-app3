name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Bundle the server
        # Syntax + import check on the whole backend — the unit tests only cover utils/.
        run: bun build server.js --target=bun --outdir /tmp/server-bundle

      - name: Build the client
        run: bun run build:client
