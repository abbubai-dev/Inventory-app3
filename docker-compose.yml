services:
  inventory-app:
    build: .
    container_name: inventory_system
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres-db # 🎯 POKA-YOKE: Ensures database boots before app starts

  # 🐘 POSTGRESQL DATABASE CONTAINER
  postgres-db:
    image: postgres:16-alpine
    container_name: kdip_postgres
    restart: always
    env_file: .env # 🎯 Reads environment variables automatically from .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # Secure loopback binding
    volumes:
      - kdip_postgres_data:/var/lib/postgresql/data

volumes:
  kdip_postgres_data: